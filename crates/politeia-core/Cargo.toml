[package]
name = "politeia-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
schemars.workspace = true
uuid.workspace = true
jiff.workspace = true
blake3.workspace = true
serde_json.workspace = true

[dev-dependencies]
# WHY default-features = false: the defaults pull rusty-fork, tempfile and
# bit-set to run each case in a forked process. These properties are pure
# functions over plain structs -- nothing to isolate, and a fork per case is
# cost without a corresponding guarantee.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.kanon]
maturity = "scaffold"
since = "2026-08-19"
exit-criteria = "Phase 0 ontology, identity, delegation, operation/effect, and budget invariants are finalized and their property and negative tests pass"
