name: ci

on:
  pull_request:
  push:
    branches: [main]

# Explicit least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv-1.85.0
      - run: cargo +1.85.0 check --workspace --all-targets --locked

  rust:
    name: rust (1.97.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: repository-toolchain
        name: Read repository toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ steps.repository-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # --locked everywhere: a stale Cargo.lock fails fast at the step that
      # needed it rather than surfacing as a dirty-tree failure at the end.
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - id: derive-schemas
        name: Derive public schemas
        shell: bash
        run: |
          cargo run -p xtask --locked -- derive
          schema_status="$(git status --porcelain=v1 --untracked-files=all -- \
            spec/extension-manifest.schema.json \
            spec/semantic-operation.schema.json \
            spec/institution-workspace.schema.json \
            spec/commissioning-record.schema.json \
            spec/runtime-generation.schema.json \
            spec/execution-resource.schema.json \
            spec/execution-requirement.schema.json \
            spec/capability-profile.schema.json \
            spec/capability-verification.schema.json \
            spec/availability-snapshot.schema.json \
            spec/routing-decision.schema.json \
            spec/lifecycle-transition.schema.json \
            spec/handoff-receipt.schema.json)"
          if [[ -z "$schema_status" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload stale schema replacements
        if: steps.derive-schemas.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: politeia-generated-schemas-${{ github.sha }}
          path: |
            spec/extension-manifest.schema.json
            spec/semantic-operation.schema.json
            spec/institution-workspace.schema.json
            spec/commissioning-record.schema.json
            spec/runtime-generation.schema.json
            spec/execution-resource.schema.json
            spec/execution-requirement.schema.json
            spec/capability-profile.schema.json
            spec/capability-verification.schema.json
            spec/availability-snapshot.schema.json
            spec/routing-decision.schema.json
            spec/lifecycle-transition.schema.json
            spec/handoff-receipt.schema.json
          if-no-files-found: error
          retention-days: 7
      - run: cargo run -p xtask --locked -- check
      - name: Require a clean derived tree
        shell: bash
        run: |
          git diff --exit-code
          spec_status="$(git status --porcelain=v1 --untracked-files=all -- spec)"
          test -z "$spec_status"

  formal:
    name: formal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record the toolchain that checks the models
        shell: bash
        run: java -version
      # Pinned by release tag and verified by digest. An unpinned download would
      # make the assurance argument depend on whatever that URL serves today.
      - name: Fetch the model checker
        shell: bash
        env:
          TLA_VERSION: v1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          # --retry for a transport that resets, not for a fetch that fails:
          # a connection reset here fails an otherwise-green pull request for a
          # reason that has nothing to do with it. The digest check below is
          # what makes retrying safe -- whatever arrives must still be the
          # pinned artifact, however many attempts it took.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --output tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum --check --strict
      # The module list is derived from the directory, not written out here. A
      # hand-kept list is a second place to remember, and the failure when it is
      # forgotten is silent: the new model sits checked in, never run, and every
      # green run says nothing about it.
      - name: Check the models
        shell: bash
        working-directory: formal
        run: |
          shopt -s nullglob
          status=0
          for module in *.tla; do
            name="${module%.tla}"
            if [ ! -f "${name}.cfg" ]; then
              echo "::error::${module} has no ${name}.cfg, so nothing checks it"
              status=1
              continue
            fi
            echo "::group::${name}"
            # -metadir per run: TLC names its scratch directory after the
            # current second, so two runs finishing inside one second collide
            # and the second aborts before checking anything.
            java -XX:+UseParallelGC -cp ../tla2tools.jar tlc2.TLC \
              -metadir "${RUNNER_TEMP}/tlc/${name}" \
              -nowarning -config "${name}.cfg" "${module}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
      # The load-bearing step. A checker that has only run against specs which
      # satisfy their invariants has not shown it can report a violation: it
      # would pass with an invariant written as TRUE, with a cfg naming no
      # invariant, or with a jar that never executed. This module plants the
      # one transition the workflow invariant forbids and requires a rejection.
      # A fixture whose configuration omits the invariant it targets can still
      # be rejected -- by some other invariant -- and would then isolate
      # nothing while looking correct. This happened once during authoring:
      # a substring guard matched the invariant's name in a comment and skipped
      # declaring it, and the fixture went green proving nothing.
      - name: Require every fixture to declare its model's invariants
        shell: bash
        working-directory: formal
        run: |
          declared() { grep -E '^[[:space:]]*INVARIANT[[:space:]]' "$1" | awk '{print $2}' | sort; }
          status=0
          for module in negative/*.tla; do
            name="$(basename "${module}" .tla)"
            parent="$(sed -n 's/^EXTENDS \([A-Za-z]*\).*/\1/p' "${module}" | head -1)"
            [ -f "${parent}.cfg" ] || continue
            missing="$(comm -23 <(declared "${parent}.cfg") <(declared "negative/${name}.cfg"))"
            if [ -n "${missing}" ]; then
              echo "::error::negative/${name}.cfg does not declare: ${missing//$'\n'/ }"
              status=1
            fi
          done
          exit "${status}"

      - name: Require the checker to reject every planted defect
        shell: bash
        working-directory: formal/negative
        run: |
          shopt -s nullglob
          modules=(*.tla)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no planted defects found; the checker above has not been shown able to fail"
            exit 1
          fi
          : > "${RUNNER_TEMP}/isolated-invariants.txt"
          for module in "${modules[@]}"; do
            name="${module%.tla}"
            echo "::group::${name} (must be rejected)"
            # -DTLA-Library=.. so a fixture may EXTEND the model it mirrors
            # instead of restating it; a restated fixture drifts, and a drifted
            # fixture tests something other than what it claims.
            # -metadir per fixture: TLC names its scratch directory after the
            # current second. These models check in well under a second, so
            # runs collide, and a collision aborts TLC before it checks
            # anything -- with a non-zero exit that is indistinguishable from a
            # rejection.
            java -XX:+UseParallelGC -DTLA-Library=.. -cp ../../tla2tools.jar tlc2.TLC \
              -metadir "${RUNNER_TEMP}/tlc/${name}" \
              -nowarning -config "${name}.cfg" "${module}" \
              > "${RUNNER_TEMP}/${name}.log" 2>&1 || true
            cat "${RUNNER_TEMP}/${name}.log"
            # The pass condition is a reported violation, not a non-zero exit.
            # TLC exits non-zero for a parse error, a missing module, a bad
            # configuration and an aborted run, and every one of those would
            # otherwise read as "the checker caught the planted defect" while
            # the defect went unexamined.
            #
            # Two message forms, depending on whether the invariant failed in a
            # reachable state or evaluated to FALSE outright.
            violated="$(sed -nE 's/.*Invariant ([A-Za-z_]+) is violated.*/\1/p;
                                 s/.*invariant of ([A-Za-z_]+) is equal to FALSE.*/\1/p' \
              "${RUNNER_TEMP}/${name}.log" | head -1)"
            if [ -z "${violated}" ]; then
              echo "::error::${name} reported no invariant violation; either the \
          planted defect was accepted, or the run never got as far as checking it. Both \
          mean every green run above is worth less than it looks"
              exit 1
            fi
            echo "${violated}" >> "${RUNNER_TEMP}/isolated-invariants.txt"
            echo "rejected ${name} on ${violated}, as required"
            echo "::endgroup::"
          done

      # An invariant no fixture can make fire has not been shown to constrain
      # anything. Two kinds end up here, and both look exactly like a working
      # check: one that is implied by a stronger invariant beside it, and one
      # the model maintains by construction so that no reachable state can
      # negate it. Requiring a witness for each is what tells them apart.
      #
      # TypeOK is exempt. It is a well-formedness claim about the model rather
      # than about the system, and every fixture is expected to leave the model
      # well-formed -- a fixture that broke it would be reporting a bug in
      # itself.
      - name: Require every declared invariant to be falsifiable
        shell: bash
        working-directory: formal
        run: |
          declared="$(grep -hE '^[[:space:]]*INVARIANT[[:space:]]' *.cfg \
            | awk '{print $2}' | grep -vx TypeOK | sort -u)"
          isolated="$(sort -u "${RUNNER_TEMP}/isolated-invariants.txt")"
          missing="$(comm -23 <(echo "${declared}") <(echo "${isolated}"))"
          if [ -n "${missing}" ]; then
            echo "::error::no planted defect makes these fire, so nothing shows \
          they constrain the model: ${missing//$'\n'/ }"
            exit 1
          fi
          echo "every declared invariant is witnessed by a fixture that violates it"
