name: ci

on:
  pull_request:
  push:
    branches: [main]

# Explicit least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # The toolchain version itself comes from rust-toolchain.toml (one
          # fact, one place); only components are declared here.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # --locked everywhere: a stale Cargo.lock fails fast at the step that
      # needed it rather than surfacing as a dirty-tree failure at the end.
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p xtask --locked -- check
      - run: cargo run -p xtask --locked -- derive
      - run: git diff --exit-code
