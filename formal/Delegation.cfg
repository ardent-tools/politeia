\* Model configuration for Delegation.tla.
\*
\* Every set is a single element and every bound is one, which is the smallest
\* configuration in which each axis can still be widened: a widening needs one
\* member the parent lacks, and no axis needs two to show that. Growing the sets
\* multiplies the reachable grant sets without reaching a relation a subset
\* could not already exhibit.
\*
\* The sets must stay non-empty. `EveryAxisIsChecked` widens each axis to its
\* full constant, so an empty constant would make that widening a no-op and the
\* assertion would pass while testing nothing.
\*
\* CHECK_DEADLOCK is off because the grant set saturates: once every legal
\* narrowing within the bound has been issued, `Next` has no new child to add
\* and the state has no successor. That is the intended end of exploration.

CONSTANTS
    Actions = {a1}
    Resources = {r1}
    Effects = {e1}
    DataClasses = {d1}
    Audiences = {u1}
    MaxExpiry = 1
    MaxCap = 1

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Monotonic
INVARIANT EveryAxisIsChecked

CONSTRAINT GrantBound

CHECK_DEADLOCK FALSE
