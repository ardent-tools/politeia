\* Model configuration for Delegation.tla.
\*
\* Two actions, one resource and one effect is enough to exhibit every widening
\* shape on the axes this model covers, and small enough that the state space
\* stays exhaustively checkable. Growing the sets multiplies states without
\* reaching any behaviour a subset relation could not already show.
\*
\* CHECK_DEADLOCK is off because the delegation set saturates: once every legal
\* narrowing has been issued, `Next` has no new child to add and the state has
\* no successor. That is the intended end of the exploration.

CONSTANTS
    Actions = {a1, a2}
    Resources = {r1}
    Effects = {e1}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Monotonic

CONSTRAINT GrantBound

CHECK_DEADLOCK FALSE
