\* Model configuration for EffectAmbiguityIdempotentTarget.tla.
\*
\* CHECK_DEADLOCK is off because every terminal combination here is a legitimate
\* resting place: an operation whose outcome is established, compensated where
\* it needed to be, and whose replay disposition is settled has nowhere further
\* to go. Left on, TLC would report the intended end of the path as a violation.
\*
\* TargetEnforcesIdempotency is TRUE here, which is the configuration in which
\* `ReplayNeedsGrounds` is satisfied by target evidence alone. What this run
\* asks is whether the rules that do not depend on it still hold when the
\* easiest ground is always available -- in particular that uncertain
\* equivalence still fails closed, since idempotency is a property of a subject
\* and uncertainty is doubt about which subject this is.
\*
\* LocalIdentifierMinted is TRUE for the same reason inverted: the model must
\* never consult it, so the configuration that would reward consulting it is the
\* one worth running.

CONSTANTS
    NotIssued = NotIssued
    Issued = Issued
    Transferred = Transferred
    Acknowledged = Acknowledged
    NoOutcome = NoOutcome
    Ran = Ran
    DidNotRun = DidNotRun
    Unresolved = Unresolved
    Resolved = Resolved
    Blocked = Blocked
    Allowed = Allowed
    NotTested = NotTested
    NoOverlap = NoOverlap
    Overlaps = Overlaps
    Uncertain = Uncertain
    TargetEnforcesIdempotency = TRUE
    LocalIdentifierMinted = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT OutcomeRequiresEvidence
INVARIANT UnresolvedIsNotAnOutcome
INVARIANT ReplayNeedsGrounds
INVARIANT UncertainEquivalenceBlocksReplay
INVARIANT UntestedEquivalenceBlocksReplay
INVARIANT EveryReissueHadAGrant
INVARIANT CompensationFollowsResolution

CHECK_DEADLOCK FALSE
