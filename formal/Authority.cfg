\* Model configuration for Authority.tla.
\*
\* CHECK_DEADLOCK is off because the clock is bounded: at MaxTime with both
\* effects spent there is nowhere further to go, and that is the intended end of
\* every behaviour rather than a stall.
\*
\* OuterExpiry is strictly inside the clock's range. At or beyond MaxTime the
\* authority would be live in every reachable state, and NoEffectAfterExpiry,
\* InnerNeverOutlivesOuter and InnerEffectsNeedALiveOuter would all hold
\* vacuously -- three green invariants over a model in which nothing ever
\* expires.
\*
\* MaxEffects is 2 because the interesting behaviours run one effect while the
\* authority is live and attempt a second after it lapses. One would make the
\* second unreachable.

CONSTANTS
    MaxTime = 3
    OuterExpiry = 2
    MaxEffects = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoEffectAfterExpiry
INVARIANT NoEffectAfterRevocation
INVARIANT RevocationIsForwardOnly
INVARIANT InnerNeverOutlivesOuter
INVARIANT InnerEffectsNeedALiveOuter

CHECK_DEADLOCK FALSE
