\* Model configuration for Workflow.tla.
\*
\* CHECK_DEADLOCK is off because Accepted is a terminal state by design: the
\* lifecycle ends there and has no successor. Left on, TLC would report the
\* intended end of the path as a violation and the run would fail for a reason
\* that says nothing about the invariants.

CONSTANTS
    Proposed = Proposed
    Authorized = Authorized
    Running = Running
    Candidate = Candidate
    Verified = Verified
    Accepted = Accepted

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NeverExecutesUnauthorized

CHECK_DEADLOCK FALSE
