\* Model configuration for Workflow.tla.
\*
\* CHECK_DEADLOCK is off because Accepted and Denied are terminal by design: the
\* path ends at one or the other and neither has a successor. Left on, TLC would
\* report the intended end of the path as a violation and the run would fail for
\* a reason that says nothing about the invariants.

CONSTANTS
    Proposed = Proposed
    Authorized = Authorized
    Reserved = Reserved
    Leased = Leased
    Running = Running
    Candidate = Candidate
    Verified = Verified
    Accepted = Accepted
    Denied = Denied
    MaxAttempts = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NeverExecutesUnauthorized
INVARIANT NeverExecutesWithoutReservation
INVARIANT NeverExecutesWithoutLease
INVARIANT DenialIsFinal
INVARIANT AtMostOneEffectPerLease
INVARIANT EffectsRequireASpentLease

CHECK_DEADLOCK FALSE
