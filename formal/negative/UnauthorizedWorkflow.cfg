\* CI requires TLC to REJECT this module.
\*
\* Every invariant is listed, not only the one expected to fail. The others are
\* expected to HOLD, and their holding is what shows that `NeverExecutesUnauthorized`
\* catches something no other invariant here does.

CONSTANTS
    Proposed = Proposed
    Authorized = Authorized
    Reserved = Reserved
    Leased = Leased
    Running = Running
    Candidate = Candidate
    Verified = Verified
    Accepted = Accepted
    Denied = Denied
    MaxAttempts = 2

SPECIFICATION BrokenSpec

INVARIANT TypeOK
INVARIANT NeverExecutesUnauthorized
INVARIANT NeverExecutesWithoutReservation
INVARIANT NeverExecutesWithoutLease
INVARIANT DenialIsFinal
INVARIANT AtMostOneEffectPerLease
INVARIANT EffectsRequireASpentLease

CHECK_DEADLOCK FALSE
