\* CI requires TLC to REJECT this module.
\*
\* Every invariant is listed, not only the one expected to fail. The others are
\* expected to HOLD, and their holding is what shows the target invariant catches
\* something no other invariant here does.

CONSTANTS
    NotIssued = NotIssued
    Issued = Issued
    Transferred = Transferred
    Acknowledged = Acknowledged
    NoOutcome = NoOutcome
    Ran = Ran
    DidNotRun = DidNotRun
    Unresolved = Unresolved
    Resolved = Resolved
    Blocked = Blocked
    Allowed = Allowed
    NotTested = NotTested
    NoOverlap = NoOverlap
    Overlaps = Overlaps
    Uncertain = Uncertain
    TargetEnforcesIdempotency = FALSE
    LocalIdentifierMinted = TRUE

SPECIFICATION BrokenSpec

INVARIANT TypeOK
INVARIANT OutcomeRequiresEvidence
INVARIANT UnresolvedIsNotAnOutcome
INVARIANT ReplayNeedsGrounds
INVARIANT UncertainEquivalenceBlocksReplay
INVARIANT UntestedEquivalenceBlocksReplay
INVARIANT EveryReissueHadAGrant
INVARIANT CompensationFollowsResolution

CHECK_DEADLOCK FALSE
