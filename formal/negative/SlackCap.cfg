\* Configuration for the slack-cap module. CI requires TLC to REJECT this.
\*
\* MaxCap is 3 rather than 1 because the defect needs a three-link chain to
\* show itself: Cap(3) narrows Cap(2), Cap(2) narrows Cap(1), Cap(3) does not
\* narrow Cap(1). At MaxCap = 1 the domain is too small to contain the chain and
\* the module would pass -- a bounded configuration hiding the very defect it
\* was written to expose.
\*
\* Monotonic and EveryAxisIsChecked are listed deliberately. Both are expected
\* to HOLD here. Their passing beside a failing NarrowsCapIsTransitive is what
\* shows the transitivity check earns its place rather than restating them.

CONSTANTS
    Actions = {a1}
    Resources = {r1}
    Effects = {e1}
    DataClasses = {d1}
    Audiences = {u1}
    MaxExpiry = 1
    MaxCap = 3

SPECIFICATION Spec

INVARIANT Monotonic
INVARIANT EveryAxisIsChecked
INVARIANT NarrowsCapIsTransitive

CONSTRAINT GrantBound

CHECK_DEADLOCK FALSE
