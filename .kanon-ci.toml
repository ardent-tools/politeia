# archetype: B
# forge-only: false
# spdx: MPL-2.0

[pipeline]
stages = ["cargo fmt", "cargo check", "cargo clippy", "cargo test", "postgres", "xtask check", "xtask derive", "derived tree clean"]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

[stages."cargo check"]
cmd = "cargo check --workspace --all-targets --locked --jobs 8"
timeout_secs = 600

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --all-targets --locked --jobs 8 -- -D warnings"
timeout_secs = 600

[stages."cargo test"]
cmd = "cargo test --workspace --locked --jobs 8 -- --test-threads 8"
timeout_secs = 600

[stages."xtask check"]
cmd = "cargo run -p xtask --locked --jobs 8 -- check"
timeout_secs = 300

[stages.postgres]
commands = [
  { cmd = "cargo test --no-run --locked --message-format=json --jobs 8 -p politeia-storage --lib --test runtime_ledger", stdout = ".kanon-artifacts/postgres-storage-build.json" },
  { cmd = "cargo test --no-run --locked --message-format=json --jobs 8 -p politeiad --test commissioning_package", stdout = ".kanon-artifacts/postgres-package-build.json" },
  { cmd = "python3 bin/check-postgres.py", env = { POLITEIA_STORAGE_ARTIFACTS_JSON = ".kanon-artifacts/postgres-storage-build.json", POLITEIA_PACKAGE_ARTIFACTS_JSON = ".kanon-artifacts/postgres-package-build.json", POLITEIA_ACCEPTANCE_ARTIFACT_FILE = ".kanon-artifacts/postgres-package.jsonl" } },
]
timeout_secs = 600
outputs = [
  { source_path = ".kanon-artifacts/postgres-package.jsonl", logical_name = "politeia-postgres-package.jsonl", content_type = "application/x-ndjson" },
]

[secrets.stages.postgres]
required = ["POLITEIA_STORAGE_TEST_DATABASE_URL"]

[stages."xtask derive"]
cmd = "cargo run -p xtask --locked --jobs 8 -- derive"
timeout_secs = 300

[stages."derived tree clean"]
cmd = "git diff --exit-code"
timeout_secs = 300
