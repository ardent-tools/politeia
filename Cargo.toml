[workspace]
resolver = "2"
members = [
  "crates/politeia-core",
  "crates/politeia-policy",
  "crates/politeia-evidence",
  "crates/politeia-runtime",
  "crates/politeia-protocol",
  "crates/politeia-sdk",
  "crates/politeiad",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
