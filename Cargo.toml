[workspace]
resolver = "3"
members = [
  "crates/politeia-core",
  "crates/politeia-policy",
  "crates/politeia-evidence",
  "crates/politeia-runtime",
  "crates/politeia-protocol",
  "crates/politeia-sdk",
  "crates/politeiad",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
jiff = { version = "0.2", features = ["serde"] }
politeia-core = { version = "0.1.0", path = "crates/politeia-core" }
politeia-evidence = { version = "0.1.0", path = "crates/politeia-evidence" }
politeia-policy = { version = "0.1.0", path = "crates/politeia-policy" }
politeia-protocol = { version = "0.1.0", path = "crates/politeia-protocol" }
politeia-runtime = { version = "0.1.0", path = "crates/politeia-runtime" }
politeia-sdk = { version = "0.1.0", path = "crates/politeia-sdk" }
schemars = { version = "1", features = ["jiff02", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "sync"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# WHY: tests legitimately use explicit panic-on-fixture-failure helpers; each
# fixture or assertion scopes its exception with #[expect].
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
# WHY: these pedantic lints add ceremony without strengthening this small,
# typed scaffold. Safety and correctness lints remain enabled above.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
must_use_unit = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
module_name_repetitions = "allow"
similar_names = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
